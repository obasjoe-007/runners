
name: IaC DevSecOps Pipeline

on:
  push:
    branches:
      - dev
      - "dev-*"
      - "dev/**"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: ./terraform-backend-bootstrap

  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_backend_bucket_name: ${{ vars.BACKEND_BUCKET_NAME }}
  TF_VAR_kms_alias_name: ${{ vars.KMS_ALIAS_NAME }}

jobs:
  terraform-devsecops:
    name: Terraform DevSecOps
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          git --version

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Verify Terraform Installation
        run: terraform version

      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          pip3 install checkov
          checkov --version

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Run Checkov IaC Security Scan
        continue-on-error: true
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --compact

      - name: Terraform Apply
        id: terraform_apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Terraform Destroy
        if: steps.terraform_apply.outcome == 'success'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy \
            -input=false \
            -auto-approve

